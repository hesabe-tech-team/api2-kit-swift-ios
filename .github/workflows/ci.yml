name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Unit tests
        run: swift test
      - name: Build the SDK for the iOS simulator
        run: >
          xcodebuild build
          -scheme Hesabe-Package
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Build the demo app for the iOS simulator
        run: >
          xcodebuild build
          -project demo/HesabeDemo.xcodeproj
          -scheme HesabeDemo
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
